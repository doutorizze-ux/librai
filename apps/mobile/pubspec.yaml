name: sinaliza_ai
description: Aplicativo móvel e web para reconhecimento de Libras em tempo real.
version: 1.0.4+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.1

  # Network
  dio: ^5.4.3

  # Native Android vision pipeline
  camera: ^0.12.0+2
  hand_landmarker: ^3.0.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

# jni 1.0.1 invokes a Kotlin DSL block that is unavailable with the Android
# toolchain generated by the current Flutter stable release. hand_landmarker
# accepts 1.0.0, which predates that upstream regression.
dependency_overrides:
  jni: 1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/weights.json
    - assets/branding/librai-icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/librai-icon.png
  min_sdk_android: 24
  remove_alpha_ios: true
  background_color_ios: "#F9F5FC"
