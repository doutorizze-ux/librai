<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Librai - Reconhecimento de Libras em tempo real.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Librai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Librai</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://traducao2.vlibras.gov.br" crossorigin>
  <link rel="preconnect" href="https://dicionario2.vlibras.gov.br" crossorigin>

  <!-- CDN scripts do MediaPipe para Visão Computacional -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    /* Esconder o elemento de vídeo de processamento de frames original */
    #mediapipe-video-source {
      display: none;
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
    }
  </style>
</head>
<body>
  <!-- Vídeo invisível usado como fonte para o processador do MediaPipe -->
  <video id="mediapipe-video-source" autoplay playsinline muted></video>

  <script>
    // Interface Global de Interoperação JavaScript-Dart
    window.sinalizaAiMediaPipe = {
      handsDetected: false,
      faceDetected: true, // Forçar verdadeiro no Web para simplificar enquadramento e evitar crash de RAM
      poseDetected: true, // Forçar verdadeiro no Web para simplificar enquadramento e evitar crash de RAM
      latestLandmarks: null,
      latestHandFrame: null,
      landmarkRevision: 0,
      trackingQuality: 'waiting',
      handsCount: 0,
      inferenceFps: 0,
      inferenceLatencyMs: 0,
      handScreenRatio: 0,
      isActive: false,

      // Inicia a câmera e o loop de landmarks
      init: function() {
        const self = window.sinalizaAiMediaPipe;
        const videoElement = document.getElementById('mediapipe-video-source');
        
        let currentHands = [];
        let currentHandFrame = null;
        let activeStream = null;
        let animationFrameId = null;
        let lastFrameStartedAt = 0;
        let lastResultAt = 0;
        let smoothedFrameInterval = 0;
        const motionTrails = [[], []];

        const updateLatestLandmarks = () => {
          // Mantido somente para telas legadas. O reconhecimento v2 consome
          // latestHandFrame, que preserva cada mão e o instante do quadro.
          self.latestLandmarks = [...currentHands];
          self.latestHandFrame = currentHandFrame;
        };

        // Inicializar Hands
        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
          maxNumHands: 2,
          // Mantém o modelo completo: a sincronização do quadro e a ausência
          // de fila cuidam da fluidez sem trocar precisão por velocidade.
          modelComplexity: 1,
          minDetectionConfidence: 0.55,
          minTrackingConfidence: 0.55
        });

        const syncCanvasSize = (canvas) => {
          const width = Math.max(1, Math.round(canvas.clientWidth || 640));
          const height = Math.max(1, Math.round(canvas.clientHeight || 480));
          if (canvas.width !== width) canvas.width = width;
          if (canvas.height !== height) canvas.height = height;
          return { width, height };
        };

        const drawCameraFrame = (ctx, width, height, image) => {
          const sourceWidth =
            Number(image?.videoWidth || image?.naturalWidth || image?.width);
          const sourceHeight =
            Number(image?.videoHeight || image?.naturalHeight || image?.height);
          if (!image || !sourceWidth || !sourceHeight) {
            return null;
          }

          const coverScale = Math.max(
            width / sourceWidth,
            height / sourceHeight
          );
          const renderedWidth = sourceWidth * coverScale;
          const renderedHeight = sourceHeight * coverScale;
          const offsetX = (width - renderedWidth) / 2;
          const offsetY = (height - renderedHeight) / 2;

          ctx.save();
          ctx.translate(width, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(
            image,
            offsetX,
            offsetY,
            renderedWidth,
            renderedHeight
          );
          ctx.restore();

          return { renderedWidth, renderedHeight, offsetX, offsetY };
        };

        const drawSkeletonCanvas = (image, multiHandLandmarks, quality) => {
          const canvas = document.getElementById('mediapipe-overlay-canvas');
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const { width, height } = syncCanvasSize(canvas);
          ctx.clearRect(0, 0, width, height);
          const frame = drawCameraFrame(ctx, width, height, image);
          if (!frame) return;
          const { renderedWidth, renderedHeight, offsetX, offsetY } = frame;
          const mapPoint = (point) => ({
            x: width - (offsetX + point.x * renderedWidth),
            y: offsetY + point.y * renderedHeight
          });

          const connections = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [9,10],[10,11],[11,12],[0,9],
            [13,14],[14,15],[15,16],[0,13],
            [17,18],[18,19],[19,20],[0,17],
            [5,9],[9,13],[13,17]
          ];

          const neonColor = quality === 'good'
            ? '#00FFD1'
            : quality === 'edge'
              ? '#FFD740'
              : quality === 'far'
                ? '#40C4FF'
                : '#FF4664';

          multiHandLandmarks.forEach((landmarks, handIndex) => {
            const wrist = mapPoint(landmarks[0]);
            const trail = motionTrails[handIndex] || motionTrails[0];
            trail.push({ ...wrist, createdAt: performance.now() });
            while (trail.length > 6 ||
                   (trail[0] && performance.now() - trail[0].createdAt > 120)) {
              trail.shift();
            }

            if (trail.length > 1) {
              ctx.save();
              ctx.lineCap = 'round';
              for (let i = 1; i < trail.length; i++) {
                ctx.beginPath();
                ctx.strokeStyle = neonColor;
                ctx.globalAlpha = i / trail.length * 0.42;
                ctx.lineWidth = 2 + (i / trail.length) * 5;
                ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
                ctx.lineTo(trail[i].x, trail[i].y);
                ctx.stroke();
              }
              ctx.restore();
            }

            ctx.strokeStyle = neonColor;
            ctx.lineWidth = Math.max(3, width / 240);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = neonColor;
            ctx.shadowBlur = 14;

            for (const [start, end] of connections) {
              const p1 = landmarks[start];
              const p2 = landmarks[end];
              if (p1 && p2) {
                const a = mapPoint(p1);
                const b = mapPoint(p2);
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
              }
            }

            ctx.shadowBlur = 10;
            ctx.fillStyle = '#F7FFFF';
            for (const pt of landmarks) {
              const mapped = mapPoint(pt);
              ctx.beginPath();
              ctx.arc(
                mapped.x,
                mapped.y,
                Math.max(3.5, width / 300),
                0,
                2 * Math.PI
              );
              ctx.fill();
            }
            ctx.shadowBlur = 0;
          });
        };

        const drawCameraCanvas = (image) => {
          const canvas = document.getElementById('mediapipe-overlay-canvas');
          if (canvas) {
            const ctx = canvas.getContext('2d');
            if (ctx) {
              const { width, height } = syncCanvasSize(canvas);
              ctx.clearRect(0, 0, width, height);
              drawCameraFrame(ctx, width, height, image);
            }
          }
          motionTrails.forEach(trail => trail.length = 0);
        };

        const clearCameraCanvas = () => {
          const canvas = document.getElementById('mediapipe-overlay-canvas');
          const ctx = canvas?.getContext('2d');
          if (canvas && ctx) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
          motionTrails.forEach(trail => trail.length = 0);
        };

        hands.onResults((results) => {
          const resultAt = performance.now();
          self.inferenceLatencyMs = lastFrameStartedAt > 0
            ? Math.round(resultAt - lastFrameStartedAt)
            : 0;
          if (lastResultAt > 0) {
            const interval = resultAt - lastResultAt;
            smoothedFrameInterval = smoothedFrameInterval === 0
              ? interval
              : smoothedFrameInterval * 0.8 + interval * 0.2;
            self.inferenceFps = smoothedFrameInterval > 0
              ? Math.round((1000 / smoothedFrameInterval) * 10) / 10
              : 0;
          }
          lastResultAt = resultAt;

          if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            self.handsDetected = true;
            self.handsCount = results.multiHandLandmarks.length;
            currentHands = results.multiHandLandmarks.flat();
            currentHandFrame = {
              timestampMs: Math.round(performance.timeOrigin + resultAt),
              hands: results.multiHandLandmarks.map((landmarks, index) => {
                const classification =
                  results.multiHandedness?.[index]?.[0] || {};
                return {
                  handedness: classification.label || 'Unknown',
                  score: Number(classification.score || 0),
                  landmarks: landmarks.map(({ x, y, z }) => ({ x, y, z }))
                };
              })
            };
            const closeToEdge = currentHands.some(
              point => point.x < 0.055 || point.x > 0.945 ||
                       point.y < 0.055 || point.y > 0.945
            );
            const xs = currentHands.map(point => point.x);
            const ys = currentHands.map(point => point.y);
            const handWidth = Math.max(...xs) - Math.min(...xs);
            const handHeight = Math.max(...ys) - Math.min(...ys);
            self.handScreenRatio = Math.round(
              Math.max(handWidth, handHeight) * 100
            );
            const tooFar = self.handScreenRatio < 6;
            self.trackingQuality = closeToEdge
              ? 'edge'
              : tooFar
                ? 'far'
                : 'good';
            drawSkeletonCanvas(
              results.image,
              results.multiHandLandmarks,
              self.trackingQuality
            );
          } else {
            self.handsDetected = false;
            self.handsCount = 0;
            self.trackingQuality = 'waiting';
            self.handScreenRatio = 0;
            currentHands = [];
            currentHandFrame = null;
            drawCameraCanvas(results.image);
          }
          updateLatestLandmarks();
          // Permite ao Flutter consumir cada resultado apenas uma vez.
          self.landmarkRevision++;
        });

        // Loop de processamento de frames nativo
        async function processFrameLoop() {
          if (!self.isActive) return;

          const now = performance.now();
          // Não cria fila de inferência: no máximo um quadro novo a cada 33 ms.
          if (videoElement &&
              videoElement.readyState === 4 &&
              now - lastFrameStartedAt >= 33) {
            try {
              lastFrameStartedAt = now;
              await hands.send({ image: videoElement });
            } catch (e) {
              console.warn("Erro ao processar frame:", e);
            }
          }
          
          if (self.isActive) {
            animationFrameId = requestAnimationFrame(processFrameLoop);
          }
        }

        if (videoElement) {
          videoElement.addEventListener('pause', () => {
            if (self.isActive) {
              videoElement.play().catch(e => console.warn("Erro ao forçar play após pausa:", e));
            }
          });
          videoElement.addEventListener('loadedmetadata', () => {
            if (self.isActive) {
              videoElement.play().catch(e => console.warn("Erro ao forçar play após metadados:", e));
            }
          });
        }

        self.start = async function() {
          if (self.isActive) return;
          self.isActive = true;

          try {
            // Garantir que o elemento de vídeo esteja no body
            if (videoElement && !document.body.contains(videoElement)) {
              document.body.appendChild(videoElement);
            }

            // Solicitar fluxo de câmera de forma estável usando WebRTC nativo
            const stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: "user" },
                width: { ideal: 960, max: 1280 },
                height: { ideal: 540, max: 720 },
                frameRate: { ideal: 30, max: 30 },
                resizeMode: { ideal: "crop-and-scale" }
              },
              audio: false
            });

            activeStream = stream;
            if (videoElement) {
              videoElement.srcObject = stream;
              videoElement.style.display = 'block';
              await videoElement.play().catch(e => console.warn("Erro no play inicial:", e));
            }

            // Iniciar loop de frames
            processFrameLoop();
          } catch (err) {
            console.error("Erro ao acessar câmera física:", err);
          }
        };

        self.stop = function() {
          self.isActive = false;
          self.handsDetected = false;
          self.handsCount = 0;
          self.trackingQuality = 'waiting';
          self.inferenceFps = 0;
          self.inferenceLatencyMs = 0;
          self.handScreenRatio = 0;
          lastFrameStartedAt = 0;
          lastResultAt = 0;
          smoothedFrameInterval = 0;
          currentHands = [];
          currentHandFrame = null;
          clearCameraCanvas();
          
          // Parar loop
          if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
          }

          // Fechar hardware da câmera completamente
          if (activeStream) {
            activeStream.getTracks().forEach(track => {
              try {
                track.stop();
              } catch (e) {}
            });
            activeStream = null;
          }

          // Limpar elemento e re-anexar de forma oculta no body
          if (videoElement) {
            videoElement.srcObject = null;
            videoElement.style.display = 'none';
            videoElement.style.position = 'absolute';
            videoElement.style.width = '0';
            videoElement.style.height = '0';
            videoElement.style.opacity = '0';
            if (!document.body.contains(videoElement)) {
              document.body.appendChild(videoElement);
            }
          }
        };
      }
    };

    // Inicializa a ponte ao carregar a página
    window.addEventListener('load', function() {
      try {
        window.sinalizaAiMediaPipe.init();
      } catch (e) {
        console.warn("MediaPipe não pôde ser carregado na inicialização.", e);
      }
    });
  </script>

  <!--
    Prepara o player oficial em segundo plano. A tela de tradução reaproveita
    este mesmo iframe, mantendo a instância Unity e os sinais já baixados.
  -->
  <script>
    (function prewarmLibraiAvatar() {
      function createPlayer() {
        if (document.getElementById('librai-avatar-prewarm')) return;
        const iframe = document.createElement('iframe');
        iframe.id = 'librai-avatar-prewarm';
        iframe.title = 'Preparando avatar Librai';
        iframe.src = new URL(
          'vlibras-player/?embedded=1',
          document.baseURI
        ).toString();
        iframe.setAttribute('aria-hidden', 'true');
        iframe.tabIndex = -1;
        Object.assign(iframe.style, {
          position: 'fixed',
          left: '-10000px',
          top: '0',
          width: '1px',
          height: '1px',
          border: '0',
          opacity: '0',
          pointerEvents: 'none'
        });
        document.body.appendChild(iframe);
      }

      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(createPlayer, { timeout: 1500 });
      } else {
        window.setTimeout(createPlayer, 800);
      }
    })();
  </script>

  <!-- Script de Boot do Flutter -->
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
