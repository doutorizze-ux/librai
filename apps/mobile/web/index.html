<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Librai - Reconhecimento de Libras em tempo real.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Librai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Librai</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://traducao2.vlibras.gov.br" crossorigin>
  <link rel="preconnect" href="https://dicionario2.vlibras.gov.br" crossorigin>

  <style>
    /* Esconder o elemento de vídeo de processamento de frames original */
    #mediapipe-video-source {
      display: none;
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
    }
  </style>
</head>
<body>
  <!-- Vídeo invisível usado como fonte para o processador do MediaPipe -->
  <video id="mediapipe-video-source" autoplay playsinline muted></video>

  <script>
    // Interface Global de Interoperação JavaScript-Dart
    window.sinalizaAiMediaPipe = {
      handsDetected: false,
      faceDetected: false,
      poseDetected: false,
      latestLandmarks: null,
      latestHandFrame: null,
      latestHolisticFrame: null,
      captureMode: 'hands',
      landmarkRevision: 0,
      trackingQuality: 'waiting',
      handsCount: 0,
      inferenceFps: 0,
      inferenceLatencyMs: 0,
      inferenceDelegate: 'initializing',
      handScreenRatio: 0,
      isActive: false,

      // Inicia a câmera e o loop de landmarks
      init: function() {
        const self = window.sinalizaAiMediaPipe;
        const videoElement = document.getElementById('mediapipe-video-source');
        
        let currentHands = [];
        let currentHandFrame = null;
        let currentHolisticFrame = null;
        let activeStream = null;
        let animationFrameId = null;
        let videoFrameCallbackId = null;
        let lastFrameStartedAt = 0;
        let lastResultAt = 0;
        let smoothedFrameInterval = 0;
        let handWorker = null;
        let workerReadyPromise = null;
        let workerMode = null;
        let frameInFlight = false;
        let cameraSessionId = 0;
        let lastSubmittedTimestamp = 0;
        const motionTrails = [[], []];

        const updateLatestLandmarks = () => {
          // Mantido somente para telas legadas. O reconhecimento v2 consome
          // latestHandFrame, que preserva cada mão e o instante do quadro.
          self.latestLandmarks = [...currentHands];
          self.latestHandFrame = currentHandFrame;
          self.latestHolisticFrame = currentHolisticFrame;
        };

        const ensureWorker = () => {
          if (workerReadyPromise && workerMode === self.captureMode) {
            return workerReadyPromise;
          }
          if (handWorker) {
            handWorker.terminate();
            handWorker = null;
          }
          workerReadyPromise = null;
          workerMode = self.captureMode;

          workerReadyPromise = new Promise((resolve, reject) => {
            const workerUrl = new URL(
              workerMode === 'holistic'
                ? 'mediapipe-holistic-worker.js'
                : 'mediapipe-hand-worker.js',
              document.baseURI
            );
            handWorker = new Worker(workerUrl);

            handWorker.onerror = (event) => {
              handWorker?.terminate();
              handWorker = null;
              workerReadyPromise = null;
              workerMode = null;
              reject(new Error(event.message || 'Falha no worker do MediaPipe.'));
            };

            handWorker.onmessage = async (event) => {
              const message = event.data || {};
              if (message.type === 'warmup-request') {
                try {
                  self.inferenceDelegate = message.delegate || 'CPU';
                  const warmupCanvas = document.createElement('canvas');
                  warmupCanvas.width = 224;
                  warmupCanvas.height = 224;
                  const warmupContext = warmupCanvas.getContext('2d');
                  warmupContext.fillStyle = '#777';
                  warmupContext.fillRect(0, 0, 224, 224);
                  const bitmap = await createImageBitmap(warmupCanvas);
                  handWorker.postMessage({ type: 'warmup', bitmap }, [bitmap]);
                } catch (error) {
                  handWorker?.terminate();
                  handWorker = null;
                  workerReadyPromise = null;
                  workerMode = null;
                  reject(error);
                }
                return;
              }
              if (message.type === 'ready') {
                self.inferenceDelegate = message.delegate || 'CPU';
                resolve();
                return;
              }
              if (message.type === 'init-error') {
                handWorker?.terminate();
                handWorker = null;
                workerReadyPromise = null;
                workerMode = null;
                reject(new Error(message.message || 'Falha ao iniciar MediaPipe.'));
                return;
              }
              handleWorkerResult(message);
            };

            handWorker.postMessage({
              type: 'init',
              wasmRoot:
                'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm',
              modelAssetPath:
                'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
              handModelAssetPath:
                'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
              poseModelAssetPath:
                'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
              faceModelAssetPath:
                'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'
            });
          });

          return workerReadyPromise;
        };

        const syncCanvasSize = (canvas) => {
          const width = Math.max(1, Math.round(canvas.clientWidth || 640));
          const height = Math.max(1, Math.round(canvas.clientHeight || 480));
          if (canvas.width !== width) canvas.width = width;
          if (canvas.height !== height) canvas.height = height;
          return { width, height };
        };

        const getCoverFrame = (width, height, image) => {
          const sourceWidth =
            Number(image?.videoWidth || image?.naturalWidth || image?.width);
          const sourceHeight =
            Number(image?.videoHeight || image?.naturalHeight || image?.height);
          if (!image || !sourceWidth || !sourceHeight) {
            return null;
          }

          const coverScale = Math.max(
            width / sourceWidth,
            height / sourceHeight
          );
          const renderedWidth = sourceWidth * coverScale;
          const renderedHeight = sourceHeight * coverScale;
          const offsetX = (width - renderedWidth) / 2;
          const offsetY = (height - renderedHeight) / 2;

          return { renderedWidth, renderedHeight, offsetX, offsetY };
        };

        const drawSkeletonCanvas = (image, multiHandLandmarks, quality) => {
          const canvas = document.getElementById('mediapipe-overlay-canvas');
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const { width, height } = syncCanvasSize(canvas);
          ctx.clearRect(0, 0, width, height);
          const frame = getCoverFrame(width, height, image);
          if (!frame) return;
          const { renderedWidth, renderedHeight, offsetX, offsetY } = frame;
          const mapPoint = (point) => ({
            x: width - (offsetX + point.x * renderedWidth),
            y: offsetY + point.y * renderedHeight
          });

          const connections = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [9,10],[10,11],[11,12],[0,9],
            [13,14],[14,15],[15,16],[0,13],
            [17,18],[18,19],[19,20],[0,17],
            [5,9],[9,13],[13,17]
          ];

          const neonColor = quality === 'good'
            ? '#00FFD1'
            : quality === 'edge'
              ? '#FFD740'
              : quality === 'far'
                ? '#40C4FF'
                : '#FF4664';

          multiHandLandmarks.forEach((landmarks, handIndex) => {
            const wrist = mapPoint(landmarks[0]);
            const trail = motionTrails[handIndex] || motionTrails[0];
            const trailNow = performance.now();
            trail.push({ ...wrist, createdAt: trailNow });
            while (trail.length > 6 ||
                   (trail[0] && trailNow - trail[0].createdAt > 120)) {
              trail.shift();
            }

            if (trail.length > 1) {
              ctx.save();
              ctx.lineCap = 'round';
              for (let i = 1; i < trail.length; i++) {
                ctx.beginPath();
                ctx.strokeStyle = neonColor;
                ctx.globalAlpha = i / trail.length * 0.42;
                ctx.lineWidth = 2 + (i / trail.length) * 5;
                ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
                ctx.lineTo(trail[i].x, trail[i].y);
                ctx.stroke();
              }
              ctx.restore();
            }

            ctx.strokeStyle = neonColor;
            ctx.lineWidth = Math.max(3, width / 240);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = neonColor;
            ctx.shadowBlur = 14;

            // Um único stroke por mão mantém o neon, mas evita dezenas de
            // rasterizações de sombra independentes em cada quadro.
            ctx.beginPath();
            for (const [start, end] of connections) {
              const p1 = landmarks[start];
              const p2 = landmarks[end];
              if (p1 && p2) {
                const a = mapPoint(p1);
                const b = mapPoint(p2);
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
              }
            }
            ctx.stroke();

            ctx.shadowBlur = 10;
            ctx.fillStyle = '#F7FFFF';
            ctx.beginPath();
            for (const pt of landmarks) {
              const mapped = mapPoint(pt);
              ctx.moveTo(mapped.x + Math.max(3.5, width / 300), mapped.y);
              ctx.arc(
                mapped.x,
                mapped.y,
                Math.max(3.5, width / 300),
                0,
                2 * Math.PI
              );
            }
            ctx.fill();
            ctx.shadowBlur = 0;
          });
        };

        const clearLandmarkCanvas = () => {
          const canvas = document.getElementById('mediapipe-overlay-canvas');
          if (canvas) {
            const ctx = canvas.getContext('2d');
            if (ctx) {
              const { width, height } = syncCanvasSize(canvas);
              ctx.clearRect(0, 0, width, height);
            }
          }
          motionTrails.forEach(trail => trail.length = 0);
        };

        const clearCameraCanvas = () => {
          const canvas = document.getElementById('mediapipe-overlay-canvas');
          const ctx = canvas?.getContext('2d');
          if (canvas && ctx) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
          motionTrails.forEach(trail => trail.length = 0);
        };

        const processResults = (
          results,
          resultAt,
          capturedTimestampMs
        ) => {
          self.faceDetected = Boolean(results.faceDetected);
          self.poseDetected = Boolean(results.poseDetected);
          if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            self.handsDetected = true;
            self.handsCount = results.multiHandLandmarks.length;
            currentHands = results.multiHandLandmarks.flat();
            const detectedHands = results.multiHandLandmarks.map(
              (landmarks, index) => {
                const classification =
                  results.multiHandedness?.[index]?.[0] || {};
                const rawLabel = classification.label;
                return {
                  landmarks,
                  handedness:
                    rawLabel === 'Left' || rawLabel === 'Right'
                      ? rawLabel
                      : 'Unknown',
                  score: Number(classification.score || 0),
                };
              },
            );
            if (
              detectedHands.length === 2 &&
              detectedHands[0].handedness === detectedHands[1].handedness
            ) {
              // A lateralidade pode oscilar em celulares mesmo quando os 21
              // pontos das duas mãos estão corretos. A posição dos pulsos
              // mantém dois slots estáveis sem descartar a captura inteira.
              const byWristX = [...detectedHands].sort(
                (a, b) => a.landmarks[0].x - b.landmarks[0].x,
              );
              byWristX[0].handedness = 'Left';
              byWristX[1].handedness = 'Right';
            }
            currentHandFrame = {
              timestampMs: capturedTimestampMs,
              hands: detectedHands.map((hand) => ({
                handedness: hand.handedness,
                score: hand.score,
                landmarks: hand.landmarks.map(
                  ({ x, y, z }) => ({ x, y, z }),
                ),
              })),
            };
            if (
              self.captureMode === 'holistic' &&
              self.faceDetected &&
              self.poseDetected &&
              Array.isArray(results.poseLandmarks) &&
              results.poseLandmarks.length === 13 &&
              results.expression
            ) {
              currentHolisticFrame = {
                timestampMs: capturedTimestampMs,
                hands: currentHandFrame.hands,
                pose: {
                  landmarks: results.poseLandmarks.map(
                    ({ x, y, z }) => ({ x, y, z }),
                  ),
                },
                expression: {
                  mouth_open: Number(results.expression.mouth_open || 0),
                  mouth_width: Number(results.expression.mouth_width || 0),
                  left_brow: Number(results.expression.left_brow || 0),
                  right_brow: Number(results.expression.right_brow || 0),
                },
              };
            } else {
              currentHolisticFrame = null;
            }
            const closeToEdge = currentHands.some(
              point => point.x < 0.055 || point.x > 0.945 ||
                       point.y < 0.055 || point.y > 0.945
            );
            const xs = currentHands.map(point => point.x);
            const ys = currentHands.map(point => point.y);
            const handWidth = Math.max(...xs) - Math.min(...xs);
            const handHeight = Math.max(...ys) - Math.min(...ys);
            self.handScreenRatio = Math.round(
              Math.max(handWidth, handHeight) * 100
            );
            const tooFar = self.handScreenRatio < 6;
            self.trackingQuality = closeToEdge
              ? 'edge'
              : tooFar
                ? 'far'
                : 'good';
            drawSkeletonCanvas(
              results.image,
              results.multiHandLandmarks,
              self.trackingQuality
            );
          } else {
            self.handsDetected = false;
            self.handsCount = 0;
            self.trackingQuality = 'waiting';
            self.handScreenRatio = 0;
            currentHands = [];
            currentHandFrame = null;
            currentHolisticFrame = null;
            clearLandmarkCanvas();
          }
          updateLatestLandmarks();
          // Permite ao Flutter consumir cada resultado apenas uma vez.
          self.landmarkRevision++;
        };

        const handleWorkerResult = (message) => {
          if (message.type !== 'result' && message.type !== 'frame-error') {
            return;
          }
          if (message.sessionId !== cameraSessionId) return;

          frameInFlight = false;
          if (message.type === 'frame-error') {
            console.warn('Erro ao processar quadro no worker:', message.message);
            return;
          }

          const resultAt = performance.now();
          self.inferenceLatencyMs = lastFrameStartedAt > 0
            ? Math.round(resultAt - lastFrameStartedAt)
            : Number(message.inferenceLatencyMs || 0);
          if (lastResultAt > 0) {
            const interval = resultAt - lastResultAt;
            smoothedFrameInterval = smoothedFrameInterval === 0
              ? interval
              : smoothedFrameInterval * 0.8 + interval * 0.2;
            self.inferenceFps = smoothedFrameInterval > 0
              ? Math.round((1000 / smoothedFrameInterval) * 10) / 10
              : 0;
          }
          lastResultAt = resultAt;

          processResults(
            {
              image: videoElement,
              multiHandLandmarks: message.landmarks || [],
              multiHandedness: message.handedness || [],
              poseLandmarks: message.poseLandmarks || [],
              poseDetected: message.poseDetected === true,
              faceDetected: message.faceDetected === true,
              expression: message.expression || null
            },
            resultAt,
            Math.round(performance.timeOrigin + Number(message.timestampMs || 0))
          );
        };

        const scheduleNextFrame = () => {
          if (!self.isActive || !videoElement) return;
          if (typeof videoElement.requestVideoFrameCallback === 'function') {
            videoFrameCallbackId =
              videoElement.requestVideoFrameCallback(processFrameLoop);
          } else {
            animationFrameId = requestAnimationFrame(processFrameLoop);
          }
        };

        // A captura continua na UI, mas toda inferência síncrona ocorre no
        // worker. Se ele ainda estiver ocupado, o quadro novo é descartado em
        // vez de entrar em uma fila que aumentaria o atraso dos movimentos.
        async function processFrameLoop(now) {
          if (!self.isActive) return;
          scheduleNextFrame();

          if (!videoElement ||
              videoElement.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
              frameInFlight ||
              !handWorker) {
            return;
          }

          const sessionId = cameraSessionId;
          frameInFlight = true;
          lastFrameStartedAt = performance.now();
          const timestampMs = Math.max(
            lastSubmittedTimestamp + 1,
            Math.round(Number(now || lastFrameStartedAt))
          );
          lastSubmittedTimestamp = timestampMs;

          try {
            const bitmap = await createImageBitmap(videoElement);
            if (!self.isActive || sessionId !== cameraSessionId) {
              bitmap.close();
              return;
            }
            handWorker.postMessage(
              { type: 'frame', bitmap, timestampMs, sessionId },
              [bitmap]
            );
          } catch (error) {
            if (sessionId === cameraSessionId) frameInFlight = false;
            console.warn('Erro ao transferir quadro para o worker:', error);
          }
        }

        if (videoElement) {
          videoElement.addEventListener('pause', () => {
            if (self.isActive) {
              videoElement.play().catch(e => console.warn("Erro ao forçar play após pausa:", e));
            }
          });
          videoElement.addEventListener('loadedmetadata', () => {
            if (self.isActive) {
              videoElement.play().catch(e => console.warn("Erro ao forçar play após metadados:", e));
            }
          });
        }

        self.start = async function() {
          if (self.isActive) return;
          self.isActive = true;
          cameraSessionId++;
          frameInFlight = false;
          lastSubmittedTimestamp = 0;

          try {
            if (typeof createImageBitmap !== 'function') {
              throw new Error(
                'Este navegador não oferece transferência de vídeo para Web Worker.'
              );
            }

            // Garantir que o elemento de vídeo esteja no body
            if (videoElement && !document.body.contains(videoElement)) {
              document.body.appendChild(videoElement);
            }

            // Inicializa modelo e câmera em paralelo. A prévia aparece assim
            // que o WebRTC abre; o aquecimento da IA termina em segundo plano.
            const workerPromise = ensureWorker();
            const stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: "user" },
                width: { ideal: 960, max: 1280 },
                height: { ideal: 540, max: 720 },
                frameRate: { ideal: 30, max: 30 },
                resizeMode: { ideal: "crop-and-scale" }
              },
              audio: false
            });

            activeStream = stream;
            if (videoElement) {
              videoElement.srcObject = stream;
              videoElement.style.display = 'block';
              await videoElement.play().catch(e => console.warn("Erro no play inicial:", e));
            }

            await workerPromise;
            // Iniciar loop de frames
            scheduleNextFrame();
          } catch (err) {
            console.error("Erro ao acessar câmera física:", err);
            self.isActive = false;
            if (activeStream) {
              activeStream.getTracks().forEach(track => track.stop());
              activeStream = null;
            }
            if (videoElement) {
              videoElement.srcObject = null;
              videoElement.style.display = 'none';
            }
          }
        };

        self.setCaptureMode = function(mode) {
          const normalized = mode === 'holistic' ? 'holistic' : 'hands';
          if (self.captureMode === normalized && workerMode === normalized) {
            return;
          }
          const restart = self.isActive;
          if (restart) self.stop();
          if (handWorker) {
            handWorker.terminate();
            handWorker = null;
          }
          workerReadyPromise = null;
          workerMode = null;
          self.captureMode = normalized;
          self.faceDetected = false;
          self.poseDetected = false;
          currentHolisticFrame = null;
          updateLatestLandmarks();
          if (restart) {
            self.start();
          } else {
            ensureWorker().catch((error) => {
              console.warn('Pré-inicialização do modo adiada:', error);
            });
          }
        };

        self.stop = function() {
          self.isActive = false;
          cameraSessionId++;
          frameInFlight = false;
          self.handsDetected = false;
          self.faceDetected = false;
          self.poseDetected = false;
          self.handsCount = 0;
          self.trackingQuality = 'waiting';
          self.inferenceFps = 0;
          self.inferenceLatencyMs = 0;
          self.handScreenRatio = 0;
          lastFrameStartedAt = 0;
          lastResultAt = 0;
          smoothedFrameInterval = 0;
          currentHands = [];
          currentHandFrame = null;
          currentHolisticFrame = null;
          updateLatestLandmarks();
          clearCameraCanvas();
          
          // Parar loop
          if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
          }
          if (videoFrameCallbackId !== null &&
              videoElement &&
              typeof videoElement.cancelVideoFrameCallback === 'function') {
            videoElement.cancelVideoFrameCallback(videoFrameCallbackId);
            videoFrameCallbackId = null;
          }

          // Fechar hardware da câmera completamente
          if (activeStream) {
            activeStream.getTracks().forEach(track => {
              try {
                track.stop();
              } catch (e) {}
            });
            activeStream = null;
          }

          // Limpar elemento e re-anexar de forma oculta no body
          if (videoElement) {
            videoElement.srcObject = null;
            videoElement.style.display = 'none';
            videoElement.style.position = 'absolute';
            videoElement.style.width = '0';
            videoElement.style.height = '0';
            videoElement.style.opacity = '0';
            if (!document.body.contains(videoElement)) {
              document.body.appendChild(videoElement);
            }
          }
        };

        // Deixa o modelo pronto antes de o usuário abrir o tradutor. Todo o
        // carregamento e a compilação WASM acontecem fora da thread da UI.
        ensureWorker().catch((error) => {
          console.warn('Pré-inicialização do MediaPipe adiada:', error);
        });
      }
    };

    // Inicializa a ponte ao carregar a página
    window.addEventListener('load', function() {
      try {
        window.sinalizaAiMediaPipe.init();
      } catch (e) {
        console.warn("MediaPipe não pôde ser carregado na inicialização.", e);
      }
    });
  </script>

  <!--
    Prepara o player oficial em segundo plano. A tela de tradução reaproveita
    este mesmo iframe, mantendo a instância Unity e os sinais já baixados.
  -->
  <script>
    (function prewarmLibraiAvatar() {
      function createPlayer() {
        if (document.getElementById('librai-avatar-prewarm')) return;
        const iframe = document.createElement('iframe');
        iframe.id = 'librai-avatar-prewarm';
        iframe.title = 'Preparando avatar Librai';
        iframe.src = new URL(
          'vlibras-player/?embedded=1',
          document.baseURI
        ).toString();
        iframe.setAttribute('aria-hidden', 'true');
        iframe.tabIndex = -1;
        Object.assign(iframe.style, {
          position: 'fixed',
          left: '-10000px',
          top: '0',
          width: '1px',
          height: '1px',
          border: '0',
          opacity: '0',
          pointerEvents: 'none'
        });
        document.body.appendChild(iframe);
      }

      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(createPlayer, { timeout: 1500 });
      } else {
        window.setTimeout(createPlayer, 800);
      }
    })();
  </script>

  <!-- Script de Boot do Flutter -->
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
