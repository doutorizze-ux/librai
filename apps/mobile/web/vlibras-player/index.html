<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6f56a0" />
    <title>Avatar Librai</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        --brand: #6f56a0;
        --brand-dark: #49356f;
        --surface: #fbf8ff;
        --ink: #211b2b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 18%, #ffffff 0, #f5effd 52%, #e9def6 100%);
        color: var(--ink);
      }

      body {
        display: grid;
        place-items: center;
      }

      .app-shell {
        position: relative;
        width: min(100vw, 560px);
        height: 100dvh;
        min-height: 560px;
        overflow: hidden;
        background: var(--surface);
      }

      .brand {
        position: absolute;
        z-index: 4;
        top: max(14px, env(safe-area-inset-top));
        left: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px 8px 8px;
        border: 1px solid rgb(111 86 160 / 18%);
        border-radius: 999px;
        background: rgb(255 255 255 / 88%);
        box-shadow: 0 8px 24px rgb(57 35 89 / 12%);
        backdrop-filter: blur(12px);
      }

      .brand img {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        object-fit: contain;
      }

      .brand strong {
        font-size: 16px;
        letter-spacing: 0.01em;
      }

      .stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        background: transparent !important;
      }

      .loading {
        position: absolute;
        z-index: 3;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--surface);
        transition:
          opacity 240ms ease,
          visibility 240ms ease;
      }

      .loading[hidden] {
        display: grid;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .loading-card {
        width: min(82%, 320px);
        text-align: center;
      }

      .loading-card img {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        object-fit: contain;
        box-shadow: 0 12px 30px rgb(79 48 119 / 15%);
      }

      .loading-card p {
        margin: 18px 0 12px;
        font-weight: 650;
      }

      .progress-track {
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8dff2;
      }

      .progress-bar {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--brand-dark), #9f7bd0);
        transition: width 120ms linear;
      }

      .controls {
        position: absolute;
        z-index: 4;
        right: 16px;
        bottom: max(16px, env(safe-area-inset-bottom));
        left: 16px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 56px;
        gap: 10px;
        padding: 12px;
        border: 1px solid rgb(111 86 160 / 16%);
        border-radius: 22px;
        background: rgb(255 255 255 / 90%);
        box-shadow: 0 16px 44px rgb(62 39 92 / 18%);
        backdrop-filter: blur(16px);
      }

      .signal {
        min-width: 0;
      }

      .signal small {
        display: block;
        margin-bottom: 3px;
        color: #6d6378;
      }

      .signal strong {
        display: block;
        overflow: hidden;
        font-size: 22px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      button {
        width: 56px;
        min-width: 48px;
        height: 56px;
        min-height: 48px;
        border: 0;
        border-radius: 18px;
        background: var(--brand);
        color: white;
        font: inherit;
        font-size: 25px;
        cursor: pointer;
        box-shadow: 0 8px 18px rgb(79 52 118 / 24%);
      }

      button:focus-visible {
        outline: 3px solid #2d1950;
        outline-offset: 3px;
      }

      .error {
        position: absolute;
        z-index: 6;
        right: 18px;
        bottom: 100px;
        left: 18px;
        padding: 14px 16px;
        border-radius: 14px;
        background: #9d1c2b;
        color: white;
        font-size: 14px;
        text-align: center;
      }

      body.embedded .app-shell {
        height: 100dvh;
        min-height: 0;
      }

      body.embedded .brand {
        display: none;
      }

      body.embedded .controls {
        right: 12px;
        bottom: 12px;
        left: auto;
        display: block;
        padding: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
      }

      body.embedded .signal {
        display: none;
      }

      body.embedded .controls button {
        width: 48px;
        height: 48px;
        border-radius: 16px;
      }

      @media (min-width: 561px) {
        .app-shell {
          height: min(94vh, 920px);
          border-radius: 34px;
          box-shadow: 0 28px 80px rgb(51 29 80 / 22%);
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell" aria-label="Demonstração do avatar Librai">
      <header class="brand">
        <img src="librai-icon.png" alt="" />
        <strong>Librai</strong>
      </header>

      <section class="stage" aria-label="Avatar sinalizando em Libras">
        <canvas id="unity-canvas" aria-label="Avatar Librai sinalizando em Libras"></canvas>
      </section>

      <section id="loading" class="loading" aria-live="polite">
        <div class="loading-card">
          <img src="librai-icon.png" alt="" />
          <p id="loadingLabel">Preparando o avatar…</p>
          <div
            class="progress-track"
            role="progressbar"
            aria-label="Carregamento do avatar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div id="progressBar" class="progress-bar"></div>
          </div>
        </div>
      </section>

      <aside class="controls" aria-label="Controles do sinal">
        <div class="signal">
          <small>Sinal demonstrado</small>
          <strong id="glossLabel">BOM</strong>
        </div>
        <button
          id="replayButton"
          type="button"
          aria-label="Repetir demonstração do sinal"
          title="Repetir"
        >
          ↻
        </button>
      </aside>

      <div id="errorMessage" class="error" role="alert" hidden></div>
    </main>

    <script src="Build/vlibras-player-build-minimal.loader.js"></script>
    <script>
      (() => {
        const DICTIONARY_URL =
          "https://dicionario2.vlibras.gov.br/2018.3.1/WEBGL/";
        const PLAYER_MANAGER = "PlayerManager";
        const AVAILABLE_AVATARS = new Set(["librai"]);
        const params = new URLSearchParams(window.location.search);
        if (params.get("embedded") === "1") {
          document.body.classList.add("embedded");
        }
        let gloss = (params.get("glosa") || "")
          .trim()
          .toLocaleUpperCase("pt-BR");
        let selectedAvatar = normalizeAvatar(params.get("avatar"));
        const loading = document.getElementById("loading");
        const loadingLabel = document.getElementById("loadingLabel");
        const progressBar = document.getElementById("progressBar");
        const progressTrack = document.querySelector('[role="progressbar"]');
        const errorMessage = document.getElementById("errorMessage");
        const glossLabel = document.getElementById("glossLabel");
        const replayButton = document.getElementById("replayButton");

        let gameInstance;
        let ready = false;

        glossLabel.textContent = gloss || "Aguardando mensagem";

        function showError(message) {
          errorMessage.textContent = message;
          errorMessage.hidden = false;
          loading.hidden = true;
        }

        function send(target, method, value) {
          if (!gameInstance) return;
          if (typeof value === "undefined") {
            gameInstance.SendMessage(target, method);
          } else {
            gameInstance.SendMessage(target, method, value);
          }
        }

        function normalizeAvatar(value) {
          const avatar = String(value || "")
            .trim()
            .toLocaleLowerCase("pt-BR");
          return AVAILABLE_AVATARS.has(avatar) ? avatar : "librai";
        }

        function applyLibraiIdentity() {
          send(PLAYER_MANAGER, "Change", "librai");
        }

        function selectAvatar(value) {
          const nextAvatar = normalizeAvatar(value);
          if (nextAvatar === selectedAvatar) return;
          selectedAvatar = nextAvatar;
          if (!ready) return;
          send(PLAYER_MANAGER, "stopAll");
          applyLibraiIdentity();
          window.setTimeout(applyLibraiIdentity, 500);
          window.setTimeout(play, 900);
        }

        function play() {
          if (!ready || !gloss) return;
          errorMessage.hidden = true;
          send(PLAYER_MANAGER, "stopAll");
          window.setTimeout(
            () => send(PLAYER_MANAGER, "playNow", gloss),
            80,
          );
        }

        function setGloss(value) {
          const nextGloss = String(value || "")
            .trim()
            .toLocaleUpperCase("pt-BR");
          if (!nextGloss) return;
          gloss = nextGloss;
          glossLabel.textContent = gloss;
          if (ready) play();
        }

        window.addEventListener("message", (event) => {
          if (event.origin !== window.location.origin) return;
          let message = event.data;
          if (typeof message === "string") {
            try {
              message = JSON.parse(message);
            } catch (_) {
              return;
            }
          }
          if (message?.type === "librai-play") {
            selectAvatar(message.avatar);
            setGloss(message.gloss);
          }
        });

        window.onLoadPlayer = () => {
          if (!gameInstance) {
            window.setTimeout(window.onLoadPlayer, 100);
            return;
          }
          send(PLAYER_MANAGER, "initRandomAnimationsProcess");
          send(PLAYER_MANAGER, "setURL", "");
          send(PLAYER_MANAGER, "setBaseUrl", DICTIONARY_URL);
          ready = true;
          loadingLabel.textContent = "Avatar pronto";

          // O Unity ainda conclui a criação do avatar padrão após avisar que o
          // player carregou. Aplicar a identidade depois dessa etapa evita que
          // o personagem padrão sobrescreva a escolha da Librai.
          window.setTimeout(applyLibraiIdentity, 250);
          window.setTimeout(applyLibraiIdentity, 900);
          window.setTimeout(() => {
            loading.hidden = true;
            if (gloss) play();
          }, 1_350);
        };

        window.onPlayingStateChange = () => {};
        window.onLibraiPlayerError = (message) => {
          showError(message || "Não foi possível demonstrar este sinal.");
        };
        window.CounterGloss = () => {};
        window.GetAvatar = () => {};
        window.FinishWelcome = () => {};
        window.updateProgress = () => {};

        // O Unity permanece carregado. Repetir ou trocar de sinal reutiliza a
        // mesma instância, evitando baixar e inicializar o player novamente.
        replayButton.addEventListener("click", play);

        window.addEventListener("error", (event) => {
          if (!ready) {
            showError(
              "Não foi possível carregar o avatar. Verifique a conexão e tente novamente.",
            );
          }
          console.error(event.error || event.message);
        });

        const canvas = document.getElementById("unity-canvas");
        const buildUrl = "Build";
        const config = {
          dataUrl: `${buildUrl}/vlibras-player-build-minimal.data.unityweb`,
          frameworkUrl: `${buildUrl}/vlibras-player-build-minimal.framework.js.unityweb`,
          codeUrl: `${buildUrl}/vlibras-player-build-minimal.wasm.unityweb`,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Librai",
          productName: "Avatar Librai",
          productVersion: "1.0",
          matchWebGLToCanvasSize: true,
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
          showBanner: (message, type) => {
            if (type === "error") showError(message);
            else console.warn(message);
          },
        };

        createUnityInstance(canvas, config, (progress) => {
          const percent = Math.round(progress * 100);
          progressBar.style.width = `${percent}%`;
          progressTrack.setAttribute("aria-valuenow", String(percent));
          loadingLabel.textContent =
            percent < 100
              ? `Preparando o avatar… ${percent}%`
              : "Finalizando…";
        })
          .then((instance) => {
            gameInstance = instance;
            window.libraiAvatar = {
              play,
              setGloss,
              select: selectAvatar,
              customize: applyLibraiIdentity,
            };
          })
          .catch((error) => {
            console.error(error);
            showError("O player do avatar não pôde ser iniciado.");
          });
      })();
    </script>
  </body>
</html>
