version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sinaliza_postgres
    restart: always
    environment:
      POSTGRES_USER: sinaliza_user
      POSTGRES_PASSWORD: sinaliza_secure_pass123
      POSTGRES_DB: sinaliza_db
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinaliza_user -d sinaliza_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sinaliza_redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-backup:
    build:
      context: .
      dockerfile: ops/postgres-backup/Dockerfile
    container_name: sinaliza_postgres_backup
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: sinaliza_user
      POSTGRES_PASSWORD: sinaliza_secure_pass123
      POSTGRES_DB: sinaliza_db
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-librai/postgres}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/librai-backup-ready && find /backups -name '*.dump' -mmin -1500 -print -quit | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: sinaliza_api_gateway
    restart: always
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://sinaliza_user:sinaliza_secure_pass123@postgres:5432/sinaliza_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY}
      - TRAINER_ACCESS_CODE=${TRAINER_ACCESS_CODE}
      - TRAINER_DELETE_SECRET=${TRAINER_DELETE_SECRET}
      - APP_RELEASE=${SOURCE_COMMIT:-unknown}
      - INFERENCE_SERVICE_URL=http://inference-service:8001
      - API_KEY_PEPPER=${API_KEY_PEPPER}
      - ADMIN_API_SECRET=${ADMIN_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-backup:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference-service:
        condition: service_healthy

  inference-service:
    build:
      context: .
      dockerfile: apps/inference-service/Dockerfile
    container_name: librai_inference_service
    restart: always
    expose:
      - "8001"
    environment:
      - LIBRAI_MODEL_MANIFEST=/models/production.manifest.json
    volumes:
      - ./ml/models/production:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.tvcatolica.site
    container_name: sinaliza_admin_web
    restart: always
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.tvcatolica.site
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
