name: Android APK - Librai

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "data/vlibras/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        working-directory: apps/mobile
        run: |
          flutter create . \
            --platforms=android \
            --org br.com.librai \
            --project-name sinaliza_ai

      - name: Configure Librai Android permissions and name
        working-directory: apps/mobile
        run: |
          sed -i 's/android:label="sinaliza_ai"/android:label="Librai"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Apply Librai launcher icon
        working-directory: apps/mobile
        run: dart run flutter_launcher_icons -f flutter_launcher_icons-android.yaml

      - name: Build installable release APK
        working-directory: apps/mobile
        shell: bash
        run: |
          set +e
          flutter build apk --release --target lib/main_native.dart 2>&1 | tee android-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            {
              echo "### Android build failure"
              echo '```text'
              tail -n 80 android-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            error_message=$(tail -n 25 android-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/::/: :/g')
            echo "::error title=Android APK build failed::$error_message"
          fi
          exit "$build_status"

      - name: Name APK
        run: mv apps/mobile/build/app/outputs/flutter-apk/app-release.apk Librai.apk

      - name: Upload Librai APK
        uses: actions/upload-artifact@v4
        with:
          name: Librai-Android
          path: Librai.apk
          if-no-files-found: error
          retention-days: 7
