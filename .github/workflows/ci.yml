name: CI - Sinaliza AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sinaliza_user
          POSTGRES_PASSWORD: sinaliza_secure_pass123
          POSTGRES_DB: sinaliza_guard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinaliza_user -d sinaliza_guard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://sinaliza_user:sinaliza_secure_pass123@127.0.0.1:5432/sinaliza_guard_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api-gateway/requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Run pytest
        run: |
          pytest apps/api-gateway/

      - name: Run inference service tests
        run: |
          pip install -r apps/inference-service/requirements.txt
          cd apps/inference-service
          pytest

      - name: Run neural graph contract tests
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pytest ml/training/test_stgcn_core.py ml/training/test_export_dataset.py ml/training/test_metrics.py

      - name: Validate backup image and restore a dump
        run: |
          docker build -f ops/postgres-backup/Dockerfile -t librai-postgres-backup:test .
          mkdir -p "$RUNNER_TEMP/librai-backups"
          docker run --rm --network host \
            -e PGPASSWORD=sinaliza_secure_pass123 \
            postgres:15-alpine \
            psql -h 127.0.0.1 -U sinaliza_user -d sinaliza_guard_test \
            -c "CREATE TABLE IF NOT EXISTS training_samples (id varchar primary key, deleted_at timestamp); INSERT INTO training_samples VALUES ('restore-check', NULL) ON CONFLICT DO NOTHING;"
          backup_id=$(docker run -d --network host \
            -v "$RUNNER_TEMP/librai-backups:/backups" \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_USER=sinaliza_user \
            -e POSTGRES_PASSWORD=sinaliza_secure_pass123 \
            -e POSTGRES_DB=sinaliza_guard_test \
            -e BACKUP_INTERVAL_SECONDS=86400 \
            librai-postgres-backup:test)
          for attempt in $(seq 1 30); do
            test -n "$(find "$RUNNER_TEMP/librai-backups" -name '*.dump' -print -quit)" && break
            sleep 2
          done
          docker stop "$backup_id"
          test -n "$(find "$RUNNER_TEMP/librai-backups" -name '*.dump' -print -quit)"
          dump_file=$(find "$RUNNER_TEMP/librai-backups" -name '*.dump' -print -quit)
          docker run --rm --network host \
            -e PGPASSWORD=sinaliza_secure_pass123 \
            postgres:15-alpine \
            psql -h 127.0.0.1 -U sinaliza_user -d postgres \
            -c "DROP DATABASE IF EXISTS sinaliza_restore_test;" \
            -c "CREATE DATABASE sinaliza_restore_test;"
          docker run --rm --network host \
            -e PGPASSWORD=sinaliza_secure_pass123 \
            -v "$dump_file:/backup.dump:ro" \
            postgres:15-alpine \
            pg_restore -h 127.0.0.1 -U sinaliza_user \
            -d sinaliza_restore_test /backup.dump
          restored=$(docker run --rm --network host \
            -e PGPASSWORD=sinaliza_secure_pass123 \
            postgres:15-alpine \
            psql -h 127.0.0.1 -U sinaliza_user -d sinaliza_restore_test \
            -Atc "SELECT count(*) FROM training_samples WHERE id='restore-check';")
          test "$restored" = "1"

      - name: Validate VLibras importer
        run: |
          python -m unittest discover -s tools/vlibras -p "test_*.py" -v

  admin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd apps/admin-web
          npm install

      - name: Run build
        run: |
          cd apps/admin-web
          npm run build

  mobile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Run tests
        run: |
          cd apps/mobile
          flutter test

  deploy-web:
    needs: [backend-test, admin-test, mobile-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Build Web Application
        run: |
          cd apps/mobile
          flutter create . --platforms=web
          flutter build web --release --base-href "/librai/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/mobile/build/web
