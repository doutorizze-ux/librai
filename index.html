<!DOCTYPE html>
<html>
<head>
  <base href="/librai/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Librai - Reconhecimento de Libras em tempo real.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Librai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Librai</title>
  <link rel="manifest" href="manifest.json">

  <!-- CDN scripts do MediaPipe para Visão Computacional -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    /* Esconder o elemento de vídeo de processamento de frames original */
    #mediapipe-video-source {
      display: none;
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
    }
  </style>
</head>
<body>
  <!-- Vídeo invisível usado como fonte para o processador do MediaPipe -->
  <video id="mediapipe-video-source" autoplay playsinline muted></video>

  <script>
    // Interface Global de Interoperação JavaScript-Dart
    window.sinalizaAiMediaPipe = {
      handsDetected: false,
      faceDetected: true, // Forçar verdadeiro no Web para simplificar enquadramento e evitar crash de RAM
      poseDetected: true, // Forçar verdadeiro no Web para simplificar enquadramento e evitar crash de RAM
      latestLandmarks: null,
      landmarkRevision: 0,
      trackingQuality: 'waiting',
      handsCount: 0,
      inferenceFps: 0,
      inferenceLatencyMs: 0,
      handScreenRatio: 0,
      isActive: false,

      // Inicia a câmera e o loop de landmarks
      init: function() {
        const self = window.sinalizaAiMediaPipe;
        const videoElement = document.getElementById('mediapipe-video-source');
        
        let currentHands = [];
        let activeStream = null;
        let animationFrameId = null;
        let lastFrameStartedAt = 0;
        let lastResultAt = 0;
        let smoothedFrameInterval = 0;
        const motionTrails = [[], []];

        const updateLatestLandmarks = () => {
          // Combina todas as coordenadas em uma lista plana (1D) para o Dart
          self.latestLandmarks = [...currentHands];
        };

        // Inicializar Hands
        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
          maxNumHands: 2,
          // O modelo leve reduz a defasagem visual em celulares e notebooks.
          // O modelo temporal do tradutor continua sendo uma etapa separada.
          modelComplexity: 0,
          minDetectionConfidence: 0.35,
          minTrackingConfidence: 0.35
        });

        const drawSkeletonCanvas = (multiHandLandmarks, quality) => {
          const canvas = document.getElementById('mediapipe-overlay-canvas');
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const width = canvas.width = Math.max(1, canvas.clientWidth || 640);
          const height = canvas.height = Math.max(1, canvas.clientHeight || 480);
          const videoWidth = videoElement.videoWidth || 640;
          const videoHeight = videoElement.videoHeight || 480;
          const coverScale = Math.max(width / videoWidth, height / videoHeight);
          const renderedWidth = videoWidth * coverScale;
          const renderedHeight = videoHeight * coverScale;
          const offsetX = (width - renderedWidth) / 2;
          const offsetY = (height - renderedHeight) / 2;
          const mapPoint = (point) => ({
            x: width - (offsetX + point.x * renderedWidth),
            y: offsetY + point.y * renderedHeight
          });

          ctx.clearRect(0, 0, width, height);

          const connections = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [9,10],[10,11],[11,12],[0,9],
            [13,14],[14,15],[15,16],[0,13],
            [17,18],[18,19],[19,20],[0,17],
            [5,9],[9,13],[13,17]
          ];

          const neonColor = quality === 'good'
            ? '#00FFD1'
            : quality === 'edge'
              ? '#FFD740'
              : quality === 'far'
                ? '#40C4FF'
                : '#FF4664';

          multiHandLandmarks.forEach((landmarks, handIndex) => {
            const wrist = mapPoint(landmarks[0]);
            const trail = motionTrails[handIndex] || motionTrails[0];
            trail.push({ ...wrist, createdAt: performance.now() });
            while (trail.length > 18 ||
                   (trail[0] && performance.now() - trail[0].createdAt > 550)) {
              trail.shift();
            }

            if (trail.length > 1) {
              ctx.save();
              ctx.lineCap = 'round';
              for (let i = 1; i < trail.length; i++) {
                ctx.beginPath();
                ctx.strokeStyle = neonColor;
                ctx.globalAlpha = i / trail.length * 0.42;
                ctx.lineWidth = 2 + (i / trail.length) * 5;
                ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
                ctx.lineTo(trail[i].x, trail[i].y);
                ctx.stroke();
              }
              ctx.restore();
            }

            ctx.strokeStyle = neonColor;
            ctx.lineWidth = Math.max(3, width / 240);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = neonColor;
            ctx.shadowBlur = 14;

            for (const [start, end] of connections) {
              const p1 = landmarks[start];
              const p2 = landmarks[end];
              if (p1 && p2) {
                const a = mapPoint(p1);
                const b = mapPoint(p2);
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
              }
            }

            ctx.shadowBlur = 10;
            ctx.fillStyle = '#F7FFFF';
            for (const pt of landmarks) {
              const mapped = mapPoint(pt);
              ctx.beginPath();
              ctx.arc(
                mapped.x,
                mapped.y,
                Math.max(3.5, width / 300),
                0,
                2 * Math.PI
              );
              ctx.fill();
            }
            ctx.shadowBlur = 0;
          });
        };

        const clearSkeletonCanvas = () => {
          const canvas = document.getElementById('mediapipe-overlay-canvas');
          if (canvas) {
            const ctx = canvas.getContext('2d');
            if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
          motionTrails.forEach(trail => trail.length = 0);
        };

        hands.onResults((results) => {
          const resultAt = performance.now();
          self.inferenceLatencyMs = lastFrameStartedAt > 0
            ? Math.round(resultAt - lastFrameStartedAt)
            : 0;
          if (lastResultAt > 0) {
            const interval = resultAt - lastResultAt;
            smoothedFrameInterval = smoothedFrameInterval === 0
              ? interval
              : smoothedFrameInterval * 0.8 + interval * 0.2;
            self.inferenceFps = smoothedFrameInterval > 0
              ? Math.round((1000 / smoothedFrameInterval) * 10) / 10
              : 0;
          }
          lastResultAt = resultAt;

          if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            self.handsDetected = true;
            self.handsCount = results.multiHandLandmarks.length;
            currentHands = results.multiHandLandmarks.flat();
            const closeToEdge = currentHands.some(
              point => point.x < 0.055 || point.x > 0.945 ||
                       point.y < 0.055 || point.y > 0.945
            );
            const xs = currentHands.map(point => point.x);
            const ys = currentHands.map(point => point.y);
            const handWidth = Math.max(...xs) - Math.min(...xs);
            const handHeight = Math.max(...ys) - Math.min(...ys);
            self.handScreenRatio = Math.round(
              Math.max(handWidth, handHeight) * 100
            );
            const tooFar = self.handScreenRatio < 13;
            self.trackingQuality = closeToEdge
              ? 'edge'
              : tooFar
                ? 'far'
                : 'good';
            drawSkeletonCanvas(
              results.multiHandLandmarks,
              self.trackingQuality
            );
          } else {
            self.handsDetected = false;
            self.handsCount = 0;
            self.trackingQuality = 'waiting';
            self.handScreenRatio = 0;
            currentHands = [];
            clearSkeletonCanvas();
          }
          updateLatestLandmarks();
          // Permite ao Flutter consumir cada resultado apenas uma vez.
          self.landmarkRevision++;
        });

        // Loop de processamento de frames nativo
        async function processFrameLoop() {
          if (!self.isActive) return;

          const now = performance.now();
          // Não cria fila de inferência: no máximo um quadro novo a cada 33 ms.
          if (videoElement &&
              videoElement.readyState === 4 &&
              now - lastFrameStartedAt >= 33) {
            try {
              lastFrameStartedAt = now;
              await hands.send({ image: videoElement });
            } catch (e) {
              console.warn("Erro ao processar frame:", e);
            }
          }
          
          if (self.isActive) {
            animationFrameId = requestAnimationFrame(processFrameLoop);
          }
        }

        if (videoElement) {
          videoElement.addEventListener('pause', () => {
            if (self.isActive) {
              videoElement.play().catch(e => console.warn("Erro ao forçar play após pausa:", e));
            }
          });
          videoElement.addEventListener('loadedmetadata', () => {
            if (self.isActive) {
              videoElement.play().catch(e => console.warn("Erro ao forçar play após metadados:", e));
            }
          });
        }

        self.start = async function() {
          if (self.isActive) return;
          self.isActive = true;

          try {
            // Garantir que o elemento de vídeo esteja no body
            if (videoElement && !document.body.contains(videoElement)) {
              document.body.appendChild(videoElement);
            }

            // Solicitar fluxo de câmera de forma estável usando WebRTC nativo
            const stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: "user" },
                width: { ideal: 960, max: 1280 },
                height: { ideal: 540, max: 720 },
                frameRate: { ideal: 30, max: 30 },
                resizeMode: { ideal: "crop-and-scale" }
              },
              audio: false
            });

            activeStream = stream;
            if (videoElement) {
              videoElement.srcObject = stream;
              videoElement.style.display = 'block';
              await videoElement.play().catch(e => console.warn("Erro no play inicial:", e));
            }

            // Iniciar loop de frames
            processFrameLoop();
          } catch (err) {
            console.error("Erro ao acessar câmera física:", err);
          }
        };

        self.stop = function() {
          self.isActive = false;
          self.handsDetected = false;
          self.handsCount = 0;
          self.trackingQuality = 'waiting';
          self.inferenceFps = 0;
          self.inferenceLatencyMs = 0;
          self.handScreenRatio = 0;
          lastFrameStartedAt = 0;
          lastResultAt = 0;
          smoothedFrameInterval = 0;
          currentHands = [];
          clearSkeletonCanvas();
          
          // Parar loop
          if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
          }

          // Fechar hardware da câmera completamente
          if (activeStream) {
            activeStream.getTracks().forEach(track => {
              try {
                track.stop();
              } catch (e) {}
            });
            activeStream = null;
          }

          // Limpar elemento e re-anexar de forma oculta no body
          if (videoElement) {
            videoElement.srcObject = null;
            videoElement.style.display = 'none';
            videoElement.style.position = 'absolute';
            videoElement.style.width = '0';
            videoElement.style.height = '0';
            videoElement.style.opacity = '0';
            if (!document.body.contains(videoElement)) {
              document.body.appendChild(videoElement);
            }
          }
        };
      }
    };

    // Inicializa a ponte ao carregar a página
    window.addEventListener('load', function() {
      try {
        window.sinalizaAiMediaPipe.init();
      } catch (e) {
        console.warn("MediaPipe não pôde ser carregado na inicialização.", e);
      }
    });
  </script>

  <!-- Avatar 3D oficial VLibras para o dicionário web. -->
  <style>
    /*
     * O widget oficial normalmente flutua sobre o conteúdo. No dicionário do
     * Librai ele vira o palco central de uma rota dedicada.
     */
    body.librai-vlibras-stage [vw] {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      transform: none !important;
      pointer-events: none !important;
      z-index: 999999 !important;
    }

    body.librai-vlibras-stage [vw-access-button] {
      display: none !important;
    }

    body.librai-vlibras-stage [vw-plugin-wrapper] {
      position: fixed !important;
      display: block !important;
      left: 50% !important;
      right: auto !important;
      top: 50% !important;
      bottom: auto !important;
      width: 310px !important;
      height: 450px !important;
      transform: translate(-50%, -48%) !important;
      pointer-events: auto !important;
      opacity: 1 !important;
      box-shadow: 0 18px 54px rgba(31, 23, 48, 0.24) !important;
      border-radius: 14px !important;
      overflow: hidden !important;
    }

    @media (max-width: 480px) {
      body.librai-vlibras-stage [vw-plugin-wrapper] {
        top: 49% !important;
        width: min(310px, calc(100vw - 40px)) !important;
        height: min(450px, calc(100vh - 250px)) !important;
        min-height: 390px !important;
      }
    }
  </style>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');

    window.libraiSetVlibrasStage = function(visible) {
      document.body.classList.toggle('librai-vlibras-stage', Boolean(visible));

      if (!visible) {
        const closeButton = Array.from(document.querySelectorAll('button'))
          .find(function(button) {
            const accessibleName = [
              button.getAttribute('aria-label'),
              button.getAttribute('title'),
              button.textContent
            ].filter(Boolean).join(' ').toLowerCase();
            return accessibleName.includes('fechar');
          });
        if (closeButton) {
          closeButton.click();
        } else {
          const wrapper = document.querySelector('[vw-plugin-wrapper]');
          const accessButton = document.querySelector('[vw-access-button]');
          if (wrapper && wrapper.classList.contains('active') && accessButton) {
            accessButton.click();
          }
        }
      }
    };

    window.libraiPlayVlibras = function(gloss) {
      const accessButton = document.querySelector('[vw-access-button]');
      const wrapper = document.querySelector('[vw-plugin-wrapper]');

      if (wrapper && !wrapper.classList.contains('active') && accessButton) {
        accessButton.click();
      }

      let attempts = 0;
      const waitForAvatar = window.setInterval(function() {
        attempts += 1;
        const player = window.plugin && window.plugin.player;
        if (player && player.loaded) {
          window.clearInterval(waitForAvatar);
          player.play(gloss, { fromTranslation: false });
        } else if (attempts >= 60) {
          window.clearInterval(waitForAvatar);
          console.error('Avatar VLibras não ficou pronto para reproduzir', gloss);
        }
      }, 250);
    };
  </script>

  <!-- Script de Boot do Flutter -->
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
